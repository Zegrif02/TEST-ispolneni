name: Build EmbodimentApiProbe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish portable EXE
        run: dotnet publish src/EmbodimentApiProbe/EmbodimentApiProbe.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmbodimentApiProbe-win-x64
          path: publish/EmbodimentApiProbe.exe
